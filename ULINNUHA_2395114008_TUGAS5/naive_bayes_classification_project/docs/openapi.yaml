openapi: 3.0.3
info:
  title: Naive Bayes Classification API
  version: 1.0.0
  description: REST API untuk aplikasi klasifikasi menggunakan algoritma Naive Bayes.

servers:
  - url: http://localhost:8000/api

paths:
  /auth/login:
    post:
      summary: Login pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Login berhasil

  /datasets:
    get:
      summary: Daftar dataset
      responses:
        '200':
          description: Berhasil
    post:
      summary: Upload dataset
      responses:
        '201':
          description: Dataset dibuat

  /models/train:
    post:
      summary: Training Naive Bayes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id]
              properties:
                dataset_id: {type: integer}
                test_size: {type: number, default: 0.2}
      responses:
        '201':
          description: Training berhasil

  /models/{id}/evaluation:
    get:
      summary: Evaluasi model
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200':
          description: Hasil evaluasi

  /predictions:
    post:
      summary: Prediksi kelas data baru
      responses:
        '200':
          description: Hasil klasifikasi
